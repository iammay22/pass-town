<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>及格鎮</title>
<style>
:root{--ink:#3b2f4a;--paper:#fff8ef;--gold:#f2c14e;--pink:#ff8fb1;--blue:#7ec8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#2b2338;overflow:hidden;touch-action:none;color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#zone{position:fixed;left:0;top:0;width:50%;height:100%;z-index:2}
.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px;flex-wrap:wrap}
#hudL{top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 10px);max-width:62%}
#hudR{top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);flex-direction:column;align-items:flex-end}
.chip{background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 8px;font-size:13px;font-weight:700;border-radius:4px;line-height:1.3}
.chip small{font-weight:500;opacity:.8;font-size:11px}
.chip.btn{pointer-events:auto;cursor:pointer;background:var(--gold)}
.chip.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.chip.q{background:#fff3c4;max-width:100%}
.btnrow{display:flex;gap:6px}
#act{position:fixed;z-index:5;right:calc(env(safe-area-inset-right) + 26px);bottom:calc(env(safe-area-inset-bottom) + 24px);
  width:78px;height:78px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--ink);opacity:.45;transition:opacity .15s}
#act b{font-size:24px;line-height:1}
#act span{font-size:12px;margin-top:2px}
#act.on{opacity:1;background:#ffd45c}
#act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#stickHint,#stickBase{position:fixed;z-index:4;width:108px;height:108px;border-radius:50%;border:3px solid rgba(255,248,239,.8);background:rgba(59,47,74,.25);pointer-events:none}
#stickHint{left:calc(env(safe-area-inset-left) + 30px);bottom:calc(env(safe-area-inset-bottom) + 24px);opacity:.5}
#stickBase{display:none}
#stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,248,239,.92);border:3px solid var(--ink)}
#stickHint i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,248,239,.5);border:3px solid rgba(59,47,74,.5)}
#keys{display:none}
@media (hover:hover) and (pointer:fine){
  #stickHint{display:none}
  #keys{display:block;position:fixed;z-index:5;left:12px;bottom:10px;pointer-events:none}
}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:46vw;text-align:center}
#toast.on{opacity:1}
#fade{position:fixed;inset:0;z-index:15;background:#2b2338;opacity:0;pointer-events:none;transition:opacity .18s}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(43,35,56,.55);padding:10px}
.ov.on{display:flex}
.card{background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:6px;padding:14px 16px;width:min(92vw,660px);max-height:92vh;overflow:auto}
.card h1{font-size:30px;letter-spacing:4px}
.card h2{font-size:17px;margin-bottom:6px}
.card .sub{font-size:13px;opacity:.75;margin-bottom:10px}
.card p{font-size:14px;line-height:1.65;white-space:pre-line}
.card .note{font-size:12px;opacity:.7;margin-top:8px}
input{width:100%;padding:9px 10px;font-size:16px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);margin:6px 0;-webkit-user-select:text;user-select:text}
button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);border-radius:4px;padding:9px 12px;font-size:14px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button.pri{background:var(--gold)}
button.tab{box-shadow:none;padding:6px 14px}
button.tab.on{background:var(--gold)}
#mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
#mx{min-height:3.4em;margin-top:4px}
.sec{margin:8px 0}
.sec h3{font-size:13px;margin-bottom:4px;opacity:.8}
.item{border:2px solid var(--ink);border-radius:4px;padding:6px 8px;background:#fff;font-size:13px;line-height:1.5;margin-bottom:6px}
.item.main{background:#fff3c4}
.item.done{background:#e9e2ee;color:#7d7390}
.item b{display:block}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.credit{text-align:center;font-size:12px;opacity:.65;margin-top:10px}
.meter{position:relative;height:38px;border:3px solid var(--ink);background:#fff;border-radius:4px;margin:12px 0 6px;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:#9bd8a0}
.meter .mk{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--ink)}
.meter.hit{background:#e5ffe0}.meter.miss{background:#ffe0e6}
.mgInfo{font-size:14px;font-weight:700;min-height:1.6em}
.big{font-size:20px;padding:16px 10px;flex:1}
.prog{height:16px;border:2px solid var(--ink);border-radius:4px;background:#fff;margin:10px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pink)}
#mapCv{display:block;margin:8px auto 0;border:3px solid var(--ink);border-radius:4px;max-width:100%;image-rendering:pixelated}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#2b2338;color:var(--paper);align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;line-height:1.7;padding:20px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="zone"></div>
<div id="stickHint"><i></i></div>
<div id="stickBase"><div id="stickKnob"></div></div>
<div id="keys" class="chip"><small>方向鍵或 WASD 走路 · 空白鍵或 E 互動 · Tab 手冊 · M 地圖</small></div>

<div class="hud" id="hudL">
  <div class="chip" id="hName">-</div>
  <div class="chip" id="hMoney">$0</div>
  <div class="chip"><small id="hRate"></small></div>
  <div class="chip q" id="hQuest"></div>
</div>
<div class="hud" id="hudR">
  <div class="btnrow"><div class="chip btn" id="mapBtn">地圖</div><div class="chip btn" id="bookBtn">手冊 <small id="hBadge"></small></div></div>
  <div class="chip"><small id="hDaily"></small></div>
  <div class="chip"><small id="hPlace"></small></div>
  <div class="chip"><small id="hOnline"></small></div>
</div>
<button id="act" type="button"><b>A</b><span id="actLabel">互動</span></button>
<div id="toast"></div>
<div id="fade"></div>

<div class="ov on" id="title">
  <div class="card">
    <h1>及格鎮</h1>
    <div class="sub">人生岔路口的小鎮篇 · 示範版</div>
    <div id="titleNew">
      <p>取個角色名就能進去，不用註冊，不用密碼。</p>
      <input id="nameIn" maxlength="6" placeholder="角色名，最多 6 個字" autocomplete="off">
      <div class="row"><button class="pri" id="startBtn" type="button">進入小鎮</button></div>
    </div>
    <div id="titleBack" style="display:none">
      <p id="backText"></p>
      <div class="row"><button class="pri" id="contBtn" type="button">繼續</button><button id="resetBtn" type="button">換新角色</button></div>
    </div>
    <p class="note">示範版的其他玩家都是假的，進度只存在這個瀏覽器裡。手機和平板：左手搖桿走路，右手 A 鍵互動。電腦：方向鍵或 WASD 走路，空白鍵或 E 互動，Tab 開手冊，M 開地圖。</p>
    <div class="credit">made by may22</div>
  </div>
</div>

<div class="ov" id="modal"><div class="card"><h2 id="mt"></h2><p id="mx"></p><div id="mc"></div></div></div>

<div class="ov" id="book">
  <div class="card">
    <div class="row" style="margin:0 0 8px">
      <button class="tab on" data-t="d" type="button">每日</button>
      <button class="tab" data-t="q" type="button">任務簿</button>
      <button class="tab" data-t="r" type="button">履歷</button>
    </div>
    <div id="bookBody"></div>
    <div class="row">
      <button id="fastBtn" type="button">示範用：假裝離開 1 小時</button>
      <button class="pri" id="bookClose" type="button">關閉</button>
    </div>
  </div>
</div>

<div class="ov" id="mapOv">
  <div class="card">
    <div class="row" style="margin:0" id="mapTabs"></div>
    <canvas id="mapCv"></canvas>
    <p class="note">粉紅色是你，藍點是同屆玩家，黃色驚嘆號是主線，藍色驚嘆號是支線，問號代表可以回報。</p>
    <div class="row"><button class="pri" id="mapClose" type="button">關閉</button></div>
  </div>
</div>

<div class="ov" id="mg">
  <div class="card">
    <h2 id="mgT"></h2>
    <p id="mgD"></p>
    <div id="mgBody"></div>
  </div>
</div>

<div id="rotate">請把手機橫過來玩<br>小鎮是橫的</div>

<script>
(() => {
'use strict';
const T = 16;
let VH = 180;
const $ = s => document.querySelector(s);
const cv = $('#game'), cx = cv.getContext('2d');
const off = document.createElement('canvas'), oc = off.getContext('2d');
let S = 1, VW = 320, DPR = 1, OX = 0, OY = 0;

/* ---------- 工具 ---------- */
const hash = (x, y, k = 0) => { let h = (x * 374761393 + y * 668265263 + k * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = n => '$' + Math.floor(n).toLocaleString('en-US');
const R = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
let actx = null;
function beep(f = 520, d = .06, type = 'square') {
  try {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = .035;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d + .02);
  } catch (e) {}
}
let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3000); }

/* ---------- 場景 ---------- */
const scenes = {}; let cur = null;
function mkScene(id, name, w, h, indoor) {
  const m = document.createElement('canvas'); m.width = w * T; m.height = h * T;
  const s = { id, name, w, h, indoor, map: m, g: m.getContext('2d'), grid: new Uint8Array(w * h), IT: [], ents: [], dyn: [], exits: [], spots: [], labels: [] };
  scenes[id] = s; return s;
}
const solid = (s, x, y, w = 1, h = 1) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < s.w && j < s.h) s.grid[j * s.w + i] = 1; };
const isSolid = (s, x, y) => x < 0 || y < 0 || x >= s.w || y >= s.h || s.grid[y * s.w + x] === 1;

/* 建築 */
const BLD = [
  { id: 'library', name: '圖書館', scene: 'campus', x: 3, y: 3, w: 6, h: 5, wall: '#dccbf8', roof: '#8e6bd1', trim: '#6b4fb0' },
  { id: 'classroom', name: '教學大樓', scene: 'campus', x: 11, y: 3, w: 8, h: 5, wall: '#e6f0c8', roof: '#6aa84f', trim: '#4a8235' },
  { id: 'office', name: '學務處', scene: 'campus', x: 21, y: 3, w: 6, h: 5, wall: '#ffe2bd', roof: '#e8914a', trim: '#b96a2a' },
  { id: 'club', name: '社團教室', scene: 'campus', x: 29, y: 3, w: 6, h: 5, wall: '#ffc9d8', roof: '#e5607f', trim: '#b53c5a' },
  { id: 'store', name: '便利商店', scene: 'campus', x: 37, y: 3, w: 6, h: 5, wall: '#cdeefa', roof: '#3ba3d8', trim: '#2578a6', awning: true },
  { id: 'dorm', name: '宿舍', scene: 'campus', x: 30, y: 17, w: 8, h: 5, wall: '#f8ecb8', roof: '#c9a24b', trim: '#9b7a2c' },
  { id: 'cafe', name: '學生餐廳', scene: 'campus', x: 39, y: 17, w: 8, h: 5, wall: '#ffe0c2', roof: '#d9534f', trim: '#a93a37' },
  { id: 'exam', name: '考試中心', scene: 'street', x: 27, y: 1, w: 8, h: 5, wall: '#e2e2ea', roof: '#5c6b8a', trim: '#3f4b66' }
];
const door = b => ({ x: (b.x + b.w / 2) * T, y: (b.y + b.h) * T + 6, ix: (b.x + b.w / 2) * T, iy: (b.y + b.h - 2) * T - 6 });
function drawBld(mc, b) {
  const px = b.x * T, py = b.y * T, w = b.w * T, h = b.h * T;
  R(mc, 'rgba(60,40,80,.2)', px + 3, py + h, w, 4); R(mc, b.wall, px, py + 2 * T, w, h - 2 * T); R(mc, 'rgba(60,40,80,.12)', px, py + h - 3, w, 3);
  R(mc, b.roof, px - 3, py, w + 6, 2 * T); R(mc, b.trim, px - 3, py + 2 * T - 3, w + 6, 3);
  for (let i = 0; i < w + 6; i += 8) R(mc, 'rgba(255,255,255,.22)', px - 3 + i, py + 3, 4, 2 * T - 8);
  R(mc, 'rgba(255,255,255,.4)', px - 3, py, w + 6, 2);
  if (b.awning) for (let i = 0; i < w; i += 8) R(mc, (i / 8) % 2 ? '#fff' : '#e5607f', px + i, py + 2 * T, 8, 6);
  const wy = py + 2 * T + 9;
  const wins = b.w >= 8 ? [px + 8, px + 26, px + w - 40, px + w - 22] : [px + 8, px + w - 22];
  wins.forEach(wx => { R(mc, '#3b2f4a', wx - 1, wy - 1, 16, 14); R(mc, '#bfe6ff', wx, wy, 14, 12); R(mc, 'rgba(255,255,255,.7)', wx + 2, wy + 2, 4, 2); R(mc, 'rgba(255,255,255,.7)', wx + 7, wy, 1, 12); R(mc, 'rgba(255,255,255,.7)', wx, wy + 6, 14, 1); });
  const dx = (b.x + b.w / 2 - 1) * T, dy = (b.y + b.h - 2) * T;
  R(mc, '#3b2f4a', dx - 1, dy - 1, 2 * T + 2, 2 * T + 1); R(mc, '#8a5a44', dx, dy, 2 * T, 2 * T);
  R(mc, '#a8745a', dx + 2, dy + 2, T - 4, 2 * T - 2); R(mc, '#a8745a', dx + T + 2, dy + 2, T - 4, 2 * T - 2);
  R(mc, '#ffd45c', dx + T - 4, dy + T, 2, 2); R(mc, '#ffd45c', dx + T + 2, dy + T, 2, 2);
}
function grass(mc, x, y) {
  const px = x * T, py = y * T;
  R(mc, (x + y) % 2 ? '#9bd8a0' : '#94d29a', px, py, T, T);
  for (let k = 0; k < 3; k++) R(mc, '#7fc388', px + hash(x, y, k) * 14, py + hash(x, y, k + 4) * 13, 1, 2);
  if (hash(x, y, 77) > .955) { R(mc, hash(x, y, 78) > .5 ? '#fff' : '#ffd0e0', px + 5, py + 6, 2, 2); R(mc, '#ffd45c', px + 6, py + 7, 1, 1); }
}
function hedge(mc, x, y) { const px = x * T, py = y * T; R(mc, '#4aa866', px, py, T, T); for (let k = 0; k < 6; k++) R(mc, '#3d9459', px + hash(x, y, k) * 13, py + hash(x, y, k + 9) * 13, 3, 3); }
function path(mc, x, y, isP) {
  const px = x * T, py = y * T;
  R(mc, '#f3e2c4', px, py, T, T);
  for (let k = 0; k < 3; k++) R(mc, '#e8d1ab', px + hash(x, y, k) * 14, py + hash(x, y, k + 5) * 14, 2, 1);
  if (!isP(x, y - 1)) R(mc, '#d9bf93', px, py, T, 1); if (!isP(x, y + 1)) R(mc, '#d9bf93', px, py + T - 1, T, 1);
  if (!isP(x - 1, y)) R(mc, '#d9bf93', px, py, 1, T); if (!isP(x + 1, y)) R(mc, '#d9bf93', px + T - 1, py, 1, T);
}

/* 角色 */
function drawChar(g, x, y, dir, step, hair, shirt, pants) {
  x = Math.round(x); y = Math.round(y);
  R(g, 'rgba(60,40,80,.22)', x - 5, y - 1, 10, 3);
  R(g, pants, x - 3, y - 5, 3, step ? 4 : 5); R(g, pants, x, y - 5, 3, step ? 5 : 4);
  R(g, shirt, x - 4, y - 10, 8, 6);
  R(g, '#ffd9bb', x - 5, y - 9 + (step ? 1 : 0), 1, 3); R(g, '#ffd9bb', x + 4, y - 9 + (step ? 0 : 1), 1, 3);
  R(g, '#ffd9bb', x - 4, y - 16, 8, 6);
  if (dir === 'up') R(g, hair, x - 4, y - 17, 8, 7); else { R(g, hair, x - 4, y - 17, 8, 3); R(g, hair, x - 4, y - 17, 1, 5); R(g, hair, x + 3, y - 17, 1, 5); }
  if (dir === 'down') { R(g, '#2b2338', x - 2, y - 13, 1, 2); R(g, '#2b2338', x + 1, y - 13, 1, 2); }
  else if (dir === 'left') R(g, '#2b2338', x - 3, y - 13, 1, 2); else if (dir === 'right') R(g, '#2b2338', x + 2, y - 13, 1, 2);
}
function drawTree(g, tx, ty) {
  const x = tx * T + 8, y = ty * T + 15;
  R(g, 'rgba(60,40,80,.2)', x - 7, y - 2, 14, 4); R(g, '#8a5a44', x - 2, y - 8, 4, 8);
  R(g, '#4aa866', x - 9, y - 18, 18, 9); R(g, '#4aa866', x - 6, y - 23, 12, 6); R(g, '#5fbf7a', x - 7, y - 21, 12, 6); R(g, '#5fbf7a', x - 5, y - 25, 9, 3); R(g, '#86d79a', x - 4, y - 23, 4, 2);
}
function drawBench(g, b) {
  const x = b.x * T, y = b.y * T;
  R(g, 'rgba(60,40,80,.2)', x + 1, y + 13, 30, 3); R(g, '#6f4a3a', x + 2, y + 9, 3, 6); R(g, '#6f4a3a', x + 27, y + 9, 3, 6);
  R(g, '#b07c5a', x, y + 5, 32, 5); R(g, '#b07c5a', x, y, 32, 3); R(g, '#c99370', x, y + 5, 32, 1);
}
function drawBoard(g, b) {
  const x = b.x * T, y = b.y * T;
  R(g, 'rgba(60,40,80,.2)', x + 1, y + 14, 30, 3); R(g, '#6f4a3a', x + 4, y + 6, 3, 10); R(g, '#6f4a3a', x + 25, y + 6, 3, 10);
  R(g, '#3b2f4a', x - 1, y - 12, 34, 20); R(g, '#e8c9a0', x + 1, y - 10, 30, 16);
  R(g, '#ff8fb1', x + 3, y - 8, 8, 7); R(g, '#7ec8f0', x + 13, y - 8, 7, 9); R(g, '#ffd45c', x + 22, y - 7, 7, 6);
  R(g, '#3b2f4a', x + 4, y - 6, 6, 1); R(g, '#3b2f4a', x + 14, y - 5, 5, 1); R(g, '#3b2f4a', x + 23, y - 5, 5, 1);
}

/* ===== 校園 48×30 ===== */
const campus = mkScene('campus', '校園', 48, 30, false);
const BENCHES = [{ x: 7, y: 19 }, { x: 15, y: 18 }];
const BOARD = { x: 8, y: 10 };
const isRoadC = (x, y) => (y >= 12 && y <= 15 && x >= 1 && x <= 47) || (x >= 22 && x <= 25 && y >= 8 && y <= 29) || (y >= 22 && y <= 23 && x >= 15 && x <= 46)

function findPath(s, sx, sy, tx, ty) {
  if (isSolid(s, tx, ty) || isSolid(s, sx, sy)) return null;
  const W = s.w, N = s.w * s.h, prev = new Int32Array(N).fill(-1), q = new Int32Array(N);
  let h = 0, t = 0; const start = sy * W + sx, goal = ty * W + tx; q[t++] = start; prev[start] = start;
  while (h < t) {
    const c = q[h++]; if (c === goal) break;
    const x = c % W, y = (c / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (isSolid(s, nx, ny)) continue; const n = ny * W + nx;
      if (prev[n] !== -1) continue; prev[n] = c; q[t++] = n;
    }
  }
  if (prev[goal] === -1) return null;
  const out = []; let c = goal; while (c !== start) { out.push([(c % W) * T + 8, ((c / W) | 0) * T + 10]); c = prev[c]; }
  return out.reverse();
}

}

function nearest() {
  let best = null, bd = 1e9;
  for (const it of cur.IT) { const d = Math.hypot(P.x - it.x, P.y - it.y); if (d < it.r && d < bd) { best = it; bd = d; } }
  for (const e of cur.ents) { if (e.kind === 'deco') continue; const d = Math.hypot(P.x - e.x, P.y - e.y); if (d < 24 && d < bd) { best = { id: 'ent', ent: e, label: e.kind === 'player' ? '揮手' : e.kind === 'quest' ? '對話' : '聊聊', ix: e.x, iy: e.y - 32 }; bd = d; } }
  return best;
}

let modalOpen = false, busy = false, typeT = null, mg = null;
const locked = () => modalOpen || busy || !!mg;
function closeModal() { modalOpen = false; $('#modal').classList.remove('on'); clearInterval(typeT); }
function showModal(o) {
  modalOpen = true; clearInterval(typeT); $('#modal').classList.add('on'); $('#mt').textContent = o.title || '';
  const mx = $('#mx'), mcc = $('#mc'), full = o.text || ''; let i = 0;

}
const ok = (title, text, fn) => showModal({ title, text, choices: [{ label: '好', fn }] });
function dialog(title, pages, end) {
  let i = 0;

    if (i < pages.length - 1) showModal({ title, text: pages[i++], choices: [{ label: '繼續', fn: step }] });

/* ---------- 小遊戲 ---------- */
function openMg(title, desc) { $('#mgT').textContent = title; $('#mgD').textContent = desc; $('#mg').classList.add('on'); }
function closeMg() { mg = null; $('#mg').classList.remove('on'); }
function meterGame(o) {
  openMg(o.title, o.desc);
  $('#mgBody').innerHTML = '<div class="meter" id="mgM"><div class="zone" id="mgZ"></div><div class="mk" id="mgK"></div></div><div class="mgInfo" id="mgI"></div><div class="row"><button class="pri big" id="mgP" type="button">' + o.btn + '</button></div>';
  mg = { type: 'meter', o, round: 0, hits: 0, pos: 0, dir: 1, speed: o.speed || 1, zone: o.zone || .3, center: .5, wait: 0 };
  newRound(); $('#mgP').onpointerdown = e => { e.preventDefault(); mgPress(); };
}
function newRound() { mg.center = mg.zone / 2 + Math.random() * (1 - mg.zone); mg.pos = Math.random() < .5 ? 0 : 1; mg.dir = mg.pos ? -1 : 1; $('#mgZ').style.left = (mg.center - mg.zone / 2) * 100 + '%'; $('#mgZ').style.width = mg.zone * 100 + '%'; $('#mgM').className = 'meter'; $('#mgI').textContent = '第 ' + (mg.round + 1) + ' / ' + mg.o.rounds + ' 次　命中 ' + mg.hits; }
function mgPress(side) {
  if (!mg) return;
  if (mg.type === 'mash') { if (mg.t <= 0 || !side) return; if (side !== mg.last) { mg.taps++; mg.last = side; beep(side === 'L' ? 400 : 480, .03); } return; }
  if (mg.wait > 0) return;
  const hit = Math.abs(mg.pos - mg.center) <= mg.zone / 2;
  if (hit) { mg.hits++; beep(988, .08); } else beep(220, .12, 'sawtooth');
  $('#mgM').className = 'meter ' + (hit ? 'hit' : 'miss'); $('#mgI').textContent = hit ? pick(mg.o.hitT) : pick(mg.o.missT);
  mg.round++; mg.wait = .75;
}
function mashGame(o) {
  openMg(o.title, o.desc);
  $('#mgBody').innerHTML = '<div class="prog"><i id="mgBar"></i></div><div class="mgInfo" id="mgI"></div><div class="row"><button class="big" id="mgL" type="button">左腳</button><button class="big" id="mgR" type="button">右腳</button></div>';
  mg = { type: 'mash', o, t: o.time, taps: 0, last: null, end: false };
  $('#mgL').onpointerdown = e => { e.preventDefault(); mgPress('L'); }; $('#mgR').onpointerdown = e => { e.preventDefault(); mgPress('R'); };
}
function mgTick(dt) {
  if (!mg) return;
  if (mg.type === 'meter') {
    if (mg.wait > 0) { mg.wait -= dt; if (mg.wait <= 0) { if (mg.round >= mg.o.rounds) { const o = mg.o, h = mg.hits; closeMg(); o.end(h); return; } mg.zone *= mg.o.shrink || .85; mg.speed *= 1.1; newRound(); } }
    else { mg.pos += mg.dir * mg.speed * dt; if (mg.pos >= 1) { mg.pos = 1; mg.dir = -1; } if (mg.pos <= 0) { mg.pos = 0; mg.dir = 1; } }
    $('#mgK').style.left = mg.pos * 100 + '%';
  } else {
    mg.t -= dt; const laps = mg.taps / mg.o.perLap;
    $('#mgBar').style.width = Math.min(100, (laps % 1) * 100) + '%';
    $('#mgI').textContent = '剩 ' + Math.max(0, mg.t).toFixed(1) + ' 秒　已跑 ' + Math.floor(laps * 400) + ' 公尺';
    if (mg.t <= 0 && !mg.end) { mg.end = true; setTimeout(() => { const o = mg.o, n = mg.taps; closeMg(); o.end(n); }, 500); }
  }
}

    h += '</div><div class="sec"><h3>支線</h3>';
    Object.keys(SIDE).forEach(id => { const q = SIDE[id], s = sideSt(id); h += '<div class="item ' + (s === 3 ? 'done' : '') + '"><b>' + (s === 3 ? '✓ ' : '') + q.n + '</b>' + (s === 0 ? '還沒遇到委託人：' + q.who : s === 3 ? '已完成' : q.desc + '（' + q.prog() + '）<br>獎勵：' + q.reward) + '</div>'; });
    return h + '</div>';
  }
  const cl = st.clubs.map(i => CLUBS.find(c => c.id === i).n).join('、') || '無';
  let h = '<div class="sec"><h3>基本</h3><div class="item"><b>' + st.name + ' · 大一</b>選課傾向：' + (TRACK_NAME[st.track] || '未選') + '<br>知識：' + st.exp + '<br>社團：' + cl + '<br>便利商店打工：' + st.q.c.workAll + ' 次<br>宿舍家具：' + st.dorm.placed.length + ' 件</div></div>';
  h += '<div class="sec"><h3>人生紀錄</h3>' + (st.log.length ? st.log.slice().reverse().map(l => '<div class="item">' + l + '</div>').join('') : '<div class="item done">還沒有紀錄。去走走。</div>') + '</div>';
  return h;
}
function openBook() { $('#bookBody').innerHTML = bookHTML(); document.querySelectorAll('#book .tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab)); $('#book').classList.add('on'); modalOpen = true; }
function closeBook() { $('#book').classList.remove('on'); modalOpen = false; }
$('#bookBtn').addEventListener('click', () => { if (started && !locked()) openBook(); });
document.querySelectorAll('#book .tab').forEach(b => b.onclick = () => { tab = b.dataset.t; openBook(); });
$('#bookClose').addEventListener('click', closeBook);
$('#fastBtn').addEventListener('click', () => { closeBook(); setTimeout(() => settle(60, true), 50); });

/* ---------- 開始 ---------- */
function begin() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  $('#title').classList.remove('on'); started = true; buildDorm(); cur = campus; P.x = 24 * T; P.y = 17 * T;
  if (st.pos && scenes[st.pos.s] && !scenes[st.pos.s].indoor) { cur = scenes[st.pos.s]; P.x = st.pos.x; P.y = st.pos.y; if (blocked(P.x, P.y)) { cur = campus; P.x = 24 * T; P.y = 17 * T; } }
  checkDay(true); snapCam(); hud();
  const away = (Date.now() - (st.lastSeen || Date.now())) / 60000;
  if (st.fresh) { delete st.fresh; toast('先去學務處找陳老師報到。右上角的地圖可以看路。'); }
  else if (away >= 1) setTimeout(() => settle(away, false), 300);
  persist();
}
const saved = loadSave();
if (saved) { $('#titleNew').style.display = 'none'; $('#titleBack').style.display = 'block'; $('#backText').textContent = '歡迎回來，' + saved.name + '。'; $('#contBtn').onclick = () => { st = saved; begin(); }; $('#resetBtn').onclick = () => { try { localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); } catch (e) {} $('#titleBack').style.display = 'none'; $('#titleNew').style.display = 'block'; }; }
$('#startBtn').addEventListener('click', () => {
  const n = $('#nameIn').value.trim().slice(0, 6); if (!n) { $('#nameIn').focus(); toast('先取個名字吧'); return; }
  st = newState(n); st.fresh = true; begin();
});
$('#nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#startBtn').click(); });
cur = campus; st = newState('');
resize(); snapCam();
document.addEventListener('visibilitychange', () => { if (document.hidden && started) persist(); });
addEventListener('pagehide', () => { if (started) persist(); });
requestAnimationFrame(loop);
window.__town = { get st() { return st; }, P, scenes, get cur() { return cur; }, interact, nearest, QN, SIDE, goScene, setMain, cam, get S() { return S; }, get mg() { return mg; }, mgPress, findPath, BLD };
})();
